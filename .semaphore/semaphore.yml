version: v1.0
name: sxmoon15 multi-region
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Build and test
    task:
      jobs:
        - name: go build test
          parallelism: 15
          commands:
            - 'T=$(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60")'
            - 'md() { curl -s -m 2 -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/$1; }'
            - 'echo "S15 idx=$SEMAPHORE_JOB_INDEX region=$(md placement/region) az=$(md placement/availability-zone) azid=$(md placement/availability-zone-id) iid=$(md instance-id) itype=$(md instance-type) life=$(md instance-life-cycle)"'
            - checkout
            - sem-version go 1.21
            - go build -o ./bin/main
            - go vet ./...
            - go test -count=1 -run '^$' ./...
            - sleep 45
