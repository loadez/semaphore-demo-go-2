version: v1.0
name: AWS burst
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204
blocks:
  - name: Burst
    task:
      jobs:
        - name: sleep
          parallelism: 20
          commands:
            - echo "job $SEMAPHORE_JOB_INDEX on $(hostname) $(curl -s -m 2 http://169.254.169.254/latest/meta-data/instance-type -H "X-aws-ec2-metadata-token: $(curl -s -m 2 -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')" || echo not-aws)"
            - sleep 30
