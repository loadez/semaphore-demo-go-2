version: v1.0
name: f1-std4-demand-test
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2204
blocks:
  - name: std4-load
    task:
      jobs:
        - name: std4-sleep
          parallelism: 8
          commands:
            - echo "occupying f1-standard-4 / ubuntu2204 to skew chmura demand toward larger VMs"
            - sleep 600
